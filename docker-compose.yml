services:
  addon:
    build: .
    container_name: stremio-catalog-hub
    ports:
      - "${ADDON_PORT:-7000}:7000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-pt-BR}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./app:/app/app  # hot reload during development

  redis:
    image: redis:7-alpine
    container_name: stremio-catalog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
